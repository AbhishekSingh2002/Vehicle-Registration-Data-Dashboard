services:
  - type: web
    name: vehicle-dashboard
    env: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port=$PORT --server.address=0.0.0.0"
    runtime: "python"
    pythonVersion: "3.11"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
